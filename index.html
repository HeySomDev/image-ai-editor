<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🎨 AI Image Editor</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><h1>🎨 AI Image Editor</h1><p>Drag • Edit • Generate • Try-On</p></header><div class="layout"><nav class="tabs"><button class="tab-btn active" data-tab="edit">✏️ Edit</button><button class="tab-btn" data-tab="generate">✨ Generate</button><button class="tab-btn" data-tab="tryon">👕 Try-On</button></nav><main class="content"><section id="edit" class="tab active"><div class="upload" id="upload"><p>📤 Drag Image Here</p><input type="file" id="file" accept="image/*" hidden></div><div class="editor hidden" id="editor"><canvas id="canvas"></canvas><div class="controls"><div><label>Brightness <input type="range" id="bright" min="0" max="200" value="100"><span>100%</span></label></div><div><label>Contrast <input type="range" id="contrast" min="0" max="200" value="100"><span>100%</span></label></div><div><label>Saturation <input type="range" id="sat" min="0" max="200" value="100"><span>100%</span></label></div><div><label>Blur <input type="range" id="blur" min="0" max="20" value="0"><span>0px</span></label></div><div><label>Rotate <input type="range" id="rotate" min="0" max="360" value="0"><span>0°</span></label></div></div><div class="buttons"><button class="btn" id="reset">↺ Reset</button><button class="btn primary" id="download">⬇️ Download</button></div></div></section><section id="generate" class="tab"><div class="gen-form"><textarea id="prompt" placeholder="Describe image..."></textarea><select id="style"><option>Realistic</option><option>Cartoon</option><option>Painting</option><option>Cyberpunk</option></select><button class="btn primary" id="genBtn">✨ Generate</button><div id="genImg" class="hidden"><img id="genResult"><button class="btn" id="genDown">⬇️ Download</button></div><div id="genLoad" class="loading hidden"><div class="spinner"></div></div></div></section><section id="tryon" class="tab"><div class="tryon-form"><input type="file" id="person" accept="image/*"><select id="clothing"><option value="">Select Item</option><option>Shirt</option><option>Jacket</option><option>Hat</option></select><button class="btn primary" id="tryBtn">👕 Apply</button><div id="tryImg" class="hidden"><canvas id="tryCanvas"></canvas><button class="btn" id="tryDown">⬇️ Download</button></div><div id="tryLoad" class="loading hidden"><div class="spinner"></div></div></div></section></main></div></div><script src="app.js"></script></body></html>
