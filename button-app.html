<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Button Click</title>
<style>body{margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;font-family:Arial}button{padding:20px 40px;font-size:18px;cursor:pointer;background:#6366f1;color:white;border:none;border-radius:8px;transition:.2s}button:hover{background:#4f46e5;transform:scale(1.05)}</style>
</head>
<body>
<button onclick="alert('Button Clicked!')">Click Me</button>
</body>
</html>
